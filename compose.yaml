name: diary-app

services:
  diary-ai:
    build:
      context: .
      dockerfile: diary-AI/Dockerfile
    image: diary-ai:0.1.0
    restart: unless-stopped
    environment:
      SPRING_APPLICATION_NAME: diary-ai
      NACOS_ADDR: nacos:8848
    networks:
      - diary-net

networks:
  diary-net:
    external: true
    name: diary-net
